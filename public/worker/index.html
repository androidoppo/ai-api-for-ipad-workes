<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>iPad LLM Worker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0f14; color: #d7e2ea;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px 12px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h1 .sub { color: #7b8a99; font-size: 12px; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .card { background: #131a22; border: 1px solid #1f2a36; border-radius: 10px; padding: 10px 12px; }
  .card .label { font-size: 11px; color: #7b8a99; text-transform: uppercase; letter-spacing: .05em; }
  .card .value { font-size: 14px; margin-top: 4px; word-break: break-all; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #fbbf24; }
  #log {
    background: #0d1218; border: 1px solid #1f2a36; border-radius: 10px;
    height: 180px; overflow-y: auto; padding: 8px 10px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  .row { display: flex; gap: 8px; margin: 10px 0; }
  input, textarea, button {
    font: inherit; background: #131a22; color: #d7e2ea;
    border: 1px solid #2a3a4a; border-radius: 8px; padding: 8px 10px;
  }
  input:focus, textarea:focus { outline: 1px solid #3b82f6; }
  button { background: #1d4ed8; border: none; cursor: pointer; }
  button:disabled { background: #27313d; color: #66727e; }
  button.secondary { background: #27313d; }
  textarea { width: 100%; resize: vertical; }
  #chatOut { background: #0d1218; border: 1px solid #1f2a36; border-radius: 10px; padding: 10px; min-height: 60px; margin-top: 8px; white-space: pre-wrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #27313d; margin-right: 4px; }
</style>
</head>
<body>
<h1>iPad LLM Worker <span class="sub">llama.cpp (wllama) / WebGPU</span></h1>

<div class="grid">
  <div class="card"><div class="label">Server</div><div class="value" id="stServer">-</div></div>
  <div class="card"><div class="label">WebSocket</div><div class="value" id="stWs">connecting…</div></div>
  <div class="card"><div class="label">WebGPU</div><div class="value" id="stGpu">-</div></div>
  <div class="card"><div class="label">State</div><div class="value" id="stState">idle</div></div>
  <div class="card"><div class="label">Loaded model</div><div class="value" id="stModel">none</div></div>
  <div class="card"><div class="label">Jobs done</div><div class="value" id="stJobs">0</div></div>
</div>

<div id="log"></div>

<div class="row" style="margin-top:14px">
  <input id="testModel" style="flex:1" placeholder="テスト用モデル (URL または org/repo/file.gguf)" />
  <button id="btnLoad" class="secondary">ロード</button>
  <button id="btnUnload" class="secondary"> unload</button>
</div>
<div class="row">
  <textarea id="testPrompt" rows="2" placeholder="テストチャット: メッセージを入力">こんにちは。自己紹介してください。</textarea>
</div>
<div class="row">
  <button id="btnSend" style="flex:1">送信 (ローカル実行テスト)</button>
</div>
<div id="chatOut"></div>

<p style="color:#7b8a99;font-size:11px;line-height:1.6">
  このページを開いた iPad が推論ワーカーになります。ホーム画面に追加(PWA)して、画面ロックをオフにして運用してください。<br>
  ジョブはサーバーから WebSocket で届き、モデルは初回のみダウンロードされキャッシュされます。
</p>

<script type="module" src="./worker-app.js"></script>
</body>
</html>
